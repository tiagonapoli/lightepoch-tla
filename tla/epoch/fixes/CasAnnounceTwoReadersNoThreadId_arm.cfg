\* Expected: HOLDS. Two readers contending for one slot, plus a reclaimer,
\* with the threadId field removed entirely (slot owned purely by the epoch
\* word). Store-order relaxation of TSO: any pending store may become visible
\* next, so a thread's stores can be observed out of program order.
SPECIFICATION Spec
INVARIANT NoUseAfterFree
INVARIANT SlotExclusive
CONSTANT Model = "arm"
