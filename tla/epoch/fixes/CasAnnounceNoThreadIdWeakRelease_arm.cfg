\* Expected: HOLDS. threadId deleted AND the unpublish weakened to a release
\* store that may linger in the store buffer.
\* Store-order relaxation of TSO: any pending store may become visible next,
\* so a thread's stores can be observed out of program order.
SPECIFICATION Spec
INVARIANT NoUseAfterFree
INVARIANT SlotExclusive
INVARIANT OwnedSlotNotWiped
INVARIANT AnnounceVisibleWhileProtected
CONSTANT Model = "arm"
