\* Expected: HOLDS. Two symmetric peers, each with its own slot, each of which
\* both protects (Acquire -> ProtectAndDrain -> CS -> Suspend) and reclaims
\* (retire + scan) -- the configuration Tsavorite actually runs.
\* Store-order relaxation of TSO: any pending store may become visible next,
\* so a thread's stores can be observed out of program order.
SPECIFICATION Spec
INVARIANT NoUseAfterFree
INVARIANT SlotsDisjoint
INVARIANT AnnounceVisibleWhileProtected
CONSTANT Model = "arm"
