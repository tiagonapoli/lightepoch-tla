\* Expected: HOLDS. threadId deleted AND the unpublish weakened to a release
\* store that may linger in the store buffer, so the store-order relaxation
\* has something to act on again.
\* x86-TSO: the store buffer drains in FIFO order, only StoreLoad is relaxed.
SPECIFICATION Spec
INVARIANT NoUseAfterFree
INVARIANT SlotExclusive
INVARIANT OwnedSlotNotWiped
INVARIANT AnnounceVisibleWhileProtected
CONSTANT Model = "tso"
