\* Expected: VIOLATED. Control for CasAnnounceNoThreadId: a Release() reached
\* through a stale thread-private entry index, which threadId is the only
\* remaining thing that could have disqualified. The hazard is a plain data
\* race, not a memory-model artifact, so it reproduces under x86-TSO too.
SPECIFICATION Spec
INVARIANT NoUseAfterFree
INVARIANT SlotExclusive
INVARIANT OwnedSlotNotWiped
INVARIANT AnnounceVisibleWhileProtected
CONSTANT Model = "tso"
