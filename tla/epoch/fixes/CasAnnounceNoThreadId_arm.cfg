\* Expected: HOLDS. The CAS-carries-epoch fix with Entry.threadId deleted.
\* Two readers hand one slot back and forth in a loop while a reclaimer scans.
\* Ownership rests on the claim CAS plus the thread-private entry index alone.
\* Store-order relaxation of TSO: any pending store may become visible next,
\* so a thread's stores can be observed out of program order.
SPECIFICATION Spec
INVARIANT NoUseAfterFree
INVARIANT SlotExclusive
INVARIANT OwnedSlotNotWiped
INVARIANT AnnounceVisibleWhileProtected
CONSTANT Model = "arm"
