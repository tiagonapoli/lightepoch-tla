\* Expected: HOLDS. a plain unpublish cannot manufacture a FALSE POSITIVE -- the tag is another thread's id, never this one's
\* Store-order relaxation of TSO: any pending store may become visible next,
\* so a thread's stores can be observed out of program order.
SPECIFICATION Spec
INVARIANT NoFalsePositive
CONSTANT Model = "arm"
CONSTANT QueryKind = "tagged"
CONSTANT ReleaseOrder = "plain"